    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#22c77a" stop-opacity=".22"/><stop offset="1" stop-color="#22c77a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b9f6d8" stroke-opacity=".055"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
