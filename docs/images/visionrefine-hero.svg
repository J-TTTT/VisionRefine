<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">VisionRefine — local-first AI-assisted annotation</title>
  <desc id="desc">A dark green banner with annotation boxes framing the VisionRefine wordmark and a five-stage refinement workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1714"/><stop offset=".55" stop-color="#10231d"/><stop offset="1" stop-color="#07110f"/></linearGradient>
