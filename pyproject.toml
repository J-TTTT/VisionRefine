[project]
name = "visionrefine"
version = "0.1.0"
description = "Local-first AI-assisted multimodal annotation workflow"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pillow>=10.0",
  "PyYAML>=6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
segmentation = ["numpy>=2,<3", "opencv-python-headless>=4.10,<6"]

[project.scripts]
visionrefine = "visionrefine.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
visionrefine = ["static/*"]

[tool.setuptools.packages.find]
include = ["visionrefine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
